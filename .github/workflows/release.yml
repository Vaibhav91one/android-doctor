name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag, Cargo.toml and npm/package.json name the same version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          npm_version=$(node -p "require('./npm/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$npm_version" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME, Cargo.toml $version and npm/package.json $npm_version must agree"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: tar czf android-doctor-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release android-doctor
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: android-doctor-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
      - name: Rename artifacts
        run: |
          cd artifacts
          for f in */*.tar.gz; do
            mv "$f" "$(basename "$f")"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the pinned image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/doctor-labs/android-doctor:${{ github.ref_name }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  crates:
    needs: build
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish
      - if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipped publishing to crates.io"

  npm:
    # The launcher downloads the release binaries, so they must exist first.
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Launcher tests
        working-directory: npm
        run: npm test
      - name: Publish the launcher
        working-directory: npm
        run: |
          version="${{ needs.check.outputs.version }}"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set; skipped publishing to npm"
            exit 0
          fi
          if npm view "android-doctor@$version" version >/dev/null 2>&1; then
            echo "::notice::android-doctor@$version is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --access public --provenance
