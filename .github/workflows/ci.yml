name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  corpus:
    # Precision gate (docs/precision.md): generated fixtures, exact findings. The tools are
    # required here (CORPUS_REQUIRED makes a missing tool fail instead of skip); the log is checked too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs erofs-utils
      - name: Run the corpus gate
        run: |
          set -o pipefail
          CORPUS_REQUIRED=1 cargo test --test corpus -- --nocapture 2>&1 | tee corpus.log
      - name: Assert the gate really ran
        run: |
          if grep -q 'CORPUS GATE SKIPPED' corpus.log; then echo "corpus gate skipped"; exit 1; fi
          grep -q 'test result: ok. 3 passed; 0 failed; 0 ignored' corpus.log \
            || { echo "expected exactly 3 passing corpus tests"; exit 1; }
  f2fs:
    # f2fs gate (issue #128, docs/precision.md): real volumes made by mkfs.f2fs and sload.f2fs are
    # read back through the binary. The tools are required here (F2FS_REQUIRED makes a missing tool
    # fail instead of skip); the log is checked too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y f2fs-tools
      - name: Run the f2fs gate
        run: |
          set -o pipefail
          F2FS_REQUIRED=1 cargo test --test f2fs -- --nocapture 2>&1 | tee f2fs.log
      - name: Assert the gate really ran
        run: |
          if grep -q 'F2FS TESTS SKIPPED' f2fs.log; then echo "f2fs gate skipped"; exit 1; fi
          grep -q 'test result: ok. 7 passed; 0 failed; 0 ignored' f2fs.log \
            || { echo "expected exactly 7 passing f2fs tests"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: android-doctor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: It runs and reports its version
        run: docker run --rm android-doctor:ci --version
