[package]
name = "android-doctor"
version = "0.3.1"
edition = "2024"
description = "Extract and audit Android OTA and firmware images (payload.bin, super.img, ext4, erofs) without running them"
license = "MIT"
repository = "https://github.com/Vaibhav91one/android-doctor"
homepage = "https://github.com/Vaibhav91one/android-doctor"
readme = "README.md"
keywords = ["android", "firmware", "ota", "security", "forensics"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/docs/", "/npm/", "/.github/", "/AGENTS.md"]

[build-dependencies]
cc = "1"

[dependencies]
am-fs-erofs = "0.3"
am-fs-core = "0.2"
anyhow = "1.0.104"
brotli = "9.0.0"
bzip2 = "0.6.1"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
flate2 = "1.1.10"
indicatif = "0.18.6"
lz4_flex = "0.14.0"
lzma-rust2 = "0.21.0"
prost = "0.14.4"
ruzstd = "0.9.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
aes = "0.9"
cipher = "0.5"
generic-array = "0.14"
zip = "8.6.0"
tar = "0.4"
md-5 = "0.11"
rsa = { version = "0.9.10", default-features = false, features = ["std", "u64_digit", "getrandom", "pem"] }

[dev-dependencies]
rand = "0.8"
rsa = { version = "0.9.10" }
